apply plugin: 'com.android.application'

// 签名信息从 keystore.properties 读取（该文件不进版本库，见 keystore.properties.example）。
// 没有这个文件时 release 包是不签名的，仍然可以编译，方便 CI 和只想看代码的人。
def keystorePropsFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.letvcast.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.letvcast.player"
        minSdk 17
        targetSdk 34
        versionCode 149
        versionName "1.49"

        ndk {
            // 老电视（乐视 X50 Air 等）都是 ARM 32 位芯片，只保留 armeabi-v7a，
            // APK 从 40MB+ 降到 19MB。要在 arm64 设备上单独调试，把下面这行改成
            // abiFilters 'arm64-v8a' 即可（注意 ijkplayer 的 .so 只有 32 位）。
            abiFilters 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 调试包也复用同一个签名：老电视上覆盖安装不会因为签名不一致被拒
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // SMB1（CIFS）兜底：只给十几年没升级的老 NAS 用。
    // SMB2/SMB3 由项目自带的 Smb2Client 实现（纯 Java，无依赖），macOS 13+/Win10+ 走这条。
    implementation 'jcifs:jcifs:1.3.17'

    // 播放内核之一：ijkplayer 0.8.8（FFmpeg 软解，支持 mkv/avi/rmvb/h265 等全格式）
    // 说明：Android 4.3(API18) 的 libc.so 本来就导出 arc4random 系列符号，
    // 所以直接用官方原始 .so，不需要 shim 库，也不需要改 DT_NEEDED。
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'
}
